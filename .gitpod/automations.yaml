tasks:
  build-fabric:
    name: "build-fabric"
    description: "Build all Hyperledger Fabric native binaries"
    triggeredBy:
      - postDevcontainerStart
    command: |
      cd /workspaces/fabric
      echo "Building Fabric binaries..."
      make native
      echo "✅ Build complete. Binaries available in build/bin/"
      ls -lh build/bin/

  setup-test-network:
    name: "setup-test-network"
    description: "Download fabric-samples repository with test network"
    triggeredBy:
      - manual
    command: |
      cd /workspaces
      if [ ! -d "fabric-samples" ]; then
        echo "Cloning fabric-samples repository..."
        git clone https://github.com/hyperledger/fabric-samples.git
        cd fabric-samples
        echo "✅ fabric-samples cloned successfully"
      else
        echo "fabric-samples already exists"
        cd fabric-samples
        git pull
      fi
      echo "Test network available at: /workspaces/fabric-samples/test-network"

  setup-docker-images:
    name: "setup-docker-images"
    description: "Pull required Docker images for Fabric testing"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Pulling Docker images..."
      make docker-thirdparty
      echo "✅ Docker images ready"

  start-test-network:
    name: "start-test-network"
    description: "Start the Fabric test network with a channel"
    triggeredBy:
      - manual
    dependsOn:
      - setup-test-network
      - setup-docker-images
    command: |
      cd /workspaces/fabric-samples/test-network
      echo "Starting Fabric test network..."
      ./network.sh up createChannel
      echo "✅ Test network is running with channel 'mychannel'"
      echo "Run 'cd /workspaces/fabric-samples/test-network && ./network.sh down' to stop"

  stop-test-network:
    name: "stop-test-network"
    description: "Stop and clean up the Fabric test network"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric-samples/test-network
      echo "Stopping Fabric test network..."
      ./network.sh down
      echo "✅ Test network stopped and cleaned up"

  build-docker:
    name: "build-docker"
    description: "Build Fabric Docker images"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Building Fabric Docker images..."
      make docker
      echo "✅ Docker images built"
      docker images | grep hyperledger/fabric

  test-unit:
    name: "test-unit"
    description: "Run Fabric unit tests"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Running unit tests..."
      make unit-test

  check-code:
    name: "check-code"
    description: "Run basic code checks and linting"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Running code checks..."
      make basic-checks

  deploy-chaincode:
    name: "deploy-chaincode"
    description: "Deploy sample chaincode to the test network"
    triggeredBy:
      - manual
    dependsOn:
      - start-test-network
    command: |
      cd /workspaces/fabric-samples/test-network
      echo "Deploying asset-transfer-basic chaincode..."
      ./network.sh deployCC -ccn basic -ccp ../asset-transfer-basic/chaincode-go -ccl go
      echo "✅ Chaincode deployed successfully"
      echo "Test with: cd /workspaces/fabric-samples/test-network && peer chaincode invoke ..."

  run-integration-tests:
    name: "run-integration-tests"
    description: "Run Fabric integration tests"
    triggeredBy:
      - manual
    dependsOn:
      - setup-docker-images
    command: |
      cd /workspaces/fabric
      echo "Ensuring ginkgo is installed..."
      export GOPATH=/home/vscode/go
      export PATH=$PATH:$GOPATH/bin
      if ! command -v ginkgo &> /dev/null; then
        echo "Installing ginkgo..."
        go install github.com/onsi/ginkgo/v2/ginkgo@latest
      fi
      echo "Running integration tests..."
      echo "This may take 15-30 minutes..."
      make integration-test
      EXIT_CODE=$?
      echo "Cleaning up integration test artifacts..."
      find integration/ -name "*.test" -type f -delete 2>/dev/null || true
      find core/chaincode/platforms/golang/testdata/pkg/ -type f -delete 2>/dev/null || true
      if [ $EXIT_CODE -eq 0 ]; then
        echo "✅ Integration tests complete and artifacts cleaned"
      else
        echo "⚠️  Integration tests failed (exit code: $EXIT_CODE) but artifacts cleaned"
        exit $EXIT_CODE
      fi

  benchmark:
    name: "benchmark"
    description: "Run performance benchmarks"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Running performance benchmarks..."
      echo "This will run benchmarks for key packages..."
      go test -bench=. -benchmem ./common/... 2>&1 | tee benchmark-results.txt
      echo "✅ Benchmark complete. Results saved to benchmark-results.txt"

  clean-integration-tests:
    name: "clean-integration-tests"
    description: "Clean integration test artifacts (*.test binaries)"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Cleaning integration test artifacts..."
      TEST_COUNT=$(find integration/ -name "*.test" -type f 2>/dev/null | wc -l)
      if [ "$TEST_COUNT" -gt 0 ]; then
        echo "Found $TEST_COUNT test binaries to clean..."
        find integration/ -name "*.test" -type f -delete 2>/dev/null || true
        find core/chaincode/platforms/golang/testdata/pkg/ -type f -delete 2>/dev/null || true
        echo "✅ Cleaned $TEST_COUNT test binaries"
      else
        echo "No integration test artifacts found"
      fi

  clean-all:
    name: "clean-all"
    description: "Clean all build artifacts, test binaries, and Docker resources"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Cleaning build artifacts..."
      make clean-all
      echo "Cleaning integration test artifacts..."
      find integration/ -name "*.test" -type f -delete 2>/dev/null || true
      find core/chaincode/platforms/golang/testdata/pkg/ -type f -delete 2>/dev/null || true
      echo "Stopping any running test networks..."
      if [ -d "/workspaces/fabric-samples/test-network" ]; then
        cd /workspaces/fabric-samples/test-network
        ./network.sh down 2>/dev/null || true
      fi
      echo "Cleaning Docker resources..."
      docker system prune -f
      echo "✅ Cleanup complete"
