tasks:
  # ============================================================================
  # CORE BUILD (1) - Essential for all development
  # ============================================================================
  
  build-fabric:
    name: "build-fabric"
    description: "Build all Hyperledger Fabric native binaries"
    triggeredBy:
      - postDevcontainerStart
    command: |
      cd /workspaces/fabric
      echo "Building Fabric binaries..."
      make native
      echo "✅ Build complete. Binaries available in build/bin/"
      ls -lh build/bin/

  # ============================================================================
  # QUICK VALIDATION (2) - Fast feedback for all developers
  # ============================================================================
  
  quick-check:
    name: "quick-check"
    description: "Fast validation: linters + tests for changed packages (~2-5 min)"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Running quick validation checks..."
      echo "This runs: linters + unit tests for changed packages"
      echo ""
      echo "Running linters..."
      make linter
      echo ""
      echo "Running tests for changed packages..."
      make verify
      echo ""
      echo "✅ Quick check complete"
      echo "💡 Run 'gitpod automations task start check-code' for full checks"

  verify-changes:
    name: "verify-changes"
    description: "Run unit tests for changed packages only (~1-3 min)"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Testing changed packages..."
      make verify
      echo ""
      echo "✅ Changed packages verified"
      echo "💡 Run 'gitpod automations task start test-unit' for all unit tests"

  # ============================================================================
  # TEST NETWORK - BASIC (3) - For chaincode and API development
  # ============================================================================
  
  start-network:
    name: "start-network"
    description: "Start Fabric test network with channel (clean restart)"
    triggeredBy:
      - manual
    command: |
      export PATH=/workspaces/fabric/build/bin:$PATH
      
      # Clone fabric-samples if needed
      if [ ! -d "/workspaces/fabric-samples" ]; then
        echo "Cloning fabric-samples..."
        cd /workspaces
        git clone https://github.com/hyperledger/fabric-samples.git
      fi
      
      # Pull Docker images if needed
      if ! docker images | grep -q "hyperledger/fabric-peer"; then
        echo "Pulling Fabric Docker images..."
        cd /workspaces/fabric
        make docker-thirdparty
      fi
      
      # Create config symlink
      if [ ! -d "/workspaces/fabric-samples/config" ]; then
        ln -s /workspaces/fabric/sampleconfig /workspaces/fabric-samples/config
        echo "Created config symlink"
      fi
      
      cd /workspaces/fabric-samples/test-network
      
      # Clean restart to avoid "channel already exists" errors
      echo "Cleaning any existing network..."
      ./network.sh down 2>/dev/null || true
      
      echo "Starting Fabric test network..."
      ./network.sh up createChannel
      
      echo ""
      echo "✅ Test network running with channel 'mychannel'"
      echo ""
      echo "Next steps:"
      echo "  📊 View containers: docker ps"
      echo "  🔧 Deploy chaincode: gitpod automations task start deploy-chaincode"
      echo "  ✅ Validate network: gitpod automations task start validate-network"
      echo "  🛑 Stop network: gitpod automations task start stop-network"

  stop-network:
    name: "stop-network"
    description: "Stop and clean up the Fabric test network"
    triggeredBy:
      - manual
    command: |
      if [ ! -d "/workspaces/fabric-samples/test-network" ]; then
        echo "❌ Test network directory not found"
        echo "Run 'gitpod automations task start start-network' first"
        exit 1
      fi
      
      cd /workspaces/fabric-samples/test-network
      echo "Stopping Fabric test network..."
      ./network.sh down
      echo "✅ Test network stopped and cleaned up"

  deploy-chaincode:
    name: "deploy-chaincode"
    description: "Deploy sample chaincode to the test network"
    triggeredBy:
      - manual
    command: |
      export PATH=/workspaces/fabric/build/bin:$PATH
      
      if [ ! -d "/workspaces/fabric-samples/test-network" ]; then
        echo "❌ Test network not found"
        echo "Run 'gitpod automations task start start-network' first"
        exit 1
      fi
      
      # Ensure config symlink exists
      if [ ! -d "/workspaces/fabric-samples/config" ]; then
        ln -s /workspaces/fabric/sampleconfig /workspaces/fabric-samples/config
        echo "Created config symlink"
      fi
      
      cd /workspaces/fabric-samples/test-network
      
      # Check if network is running
      if ! docker ps | grep -q "peer0.org1.example.com"; then
        echo "❌ Test network is not running"
        echo "Run 'gitpod automations task start start-network' first"
        exit 1
      fi
      
      echo "Deploying asset-transfer-basic chaincode..."
      ./network.sh deployCC -ccn basic -ccp ../asset-transfer-basic/chaincode-go -ccl go
      
      echo ""
      echo "✅ Chaincode deployed successfully"
      echo ""
      echo "Test chaincode:"
      echo "  cd /workspaces/fabric-samples/test-network"
      echo "  export PATH=/workspaces/fabric/build/bin:\$PATH"
      echo "  peer chaincode invoke -o localhost:7050 --ordererTLSHostnameOverride orderer.example.com \\"
      echo "    --tls --cafile \"\${PWD}/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp/tlscacerts/tlsca.example.com-cert.pem\" \\"
      echo "    -C mychannel -n basic --peerAddresses localhost:7051 --tlsRootCertFiles \"\${PWD}/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt\" \\"
      echo "    --peerAddresses localhost:9051 --tlsRootCertFiles \"\${PWD}/organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/ca.crt\" \\"
      echo "    -c '{\"function\":\"InitLedger\",\"Args\":[]}'"

  # ============================================================================
  # TEST NETWORK - ADVANCED (2) - For ledger and advanced testing
  # ============================================================================
  
  start-network-couchdb:
    name: "start-network-couchdb"
    description: "Start Fabric test network with CouchDB state database"
    triggeredBy:
      - manual
    command: |
      export PATH=/workspaces/fabric/build/bin:$PATH
      
      # Clone fabric-samples if needed
      if [ ! -d "/workspaces/fabric-samples" ]; then
        echo "Cloning fabric-samples..."
        cd /workspaces
        git clone https://github.com/hyperledger/fabric-samples.git
      fi
      
      # Pull CouchDB image
      if ! docker images | grep -q "couchdb"; then
        echo "Pulling CouchDB image..."
        cd /workspaces/fabric
        make docker-thirdparty-couchdb
      fi
      
      # Pull Fabric images
      if ! docker images | grep -q "hyperledger/fabric-peer"; then
        echo "Pulling Fabric Docker images..."
        cd /workspaces/fabric
        make docker-thirdparty
      fi
      
      # Create config symlink
      if [ ! -d "/workspaces/fabric-samples/config" ]; then
        ln -s /workspaces/fabric/sampleconfig /workspaces/fabric-samples/config
        echo "Created config symlink"
      fi
      
      cd /workspaces/fabric-samples/test-network
      
      # Clean restart
      echo "Cleaning any existing network..."
      ./network.sh down 2>/dev/null || true
      
      echo "Starting Fabric test network with CouchDB..."
      ./network.sh up createChannel -s couchdb
      
      echo ""
      echo "✅ Test network running with CouchDB state database"
      echo ""
      echo "CouchDB Fauxton UI:"
      echo "  URL: http://localhost:5984/_utils"
      echo "  Username: admin"
      echo "  Password: adminpw"
      echo ""
      echo "Next steps:"
      echo "  🔧 Deploy chaincode: gitpod automations task start deploy-chaincode"
      echo "  🛑 Stop network: gitpod automations task start stop-network"

  restart-network:
    name: "restart-network"
    description: "Quick restart of test network (stop + start)"
    triggeredBy:
      - manual
    command: |
      export PATH=/workspaces/fabric/build/bin:$PATH
      
      if [ ! -d "/workspaces/fabric-samples/test-network" ]; then
        echo "❌ Test network directory not found"
        echo "Run 'gitpod automations task start start-network' first"
        exit 1
      fi
      
      cd /workspaces/fabric-samples/test-network
      
      echo "Stopping network..."
      ./network.sh down
      
      echo "Starting network..."
      ./network.sh up createChannel
      
      echo "✅ Network restarted"

  # ============================================================================
  # NETWORK VALIDATION (1) - Health checks
  # ============================================================================
  
  validate-network:
    name: "validate-network"
    description: "Validate that the test network is fully functional"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Running comprehensive network validation..."
      .gitpod/validate-network.sh
      echo ""
      echo "💡 Tip: Run 'gitpod automations task start validate-network' anytime to check network health"

  # ============================================================================
  # TESTING - UNIT (2) - For all developers
  # ============================================================================
  
  test-unit:
    name: "test-unit"
    description: "Run all Fabric unit tests (~15-20 min)"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Running all unit tests..."
      echo "⏱️  This will take 15-20 minutes"
      echo "💡 For faster feedback, use 'verify-changes' to test only changed packages"
      echo ""
      make unit-test
      echo ""
      echo "✅ All unit tests passed"

  # ============================================================================
  # TESTING - INTEGRATION SUITES (6) - Granular test execution
  # ============================================================================
  
  test-consensus:
    name: "test-consensus"
    description: "Run consensus integration tests: raft + smartbft (~5 min)"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      
      # Ensure Docker images available
      if ! docker images | grep -q "hyperledger/fabric-peer"; then
        echo "Pulling Docker images..."
        make docker-thirdparty
      fi
      
      echo "Running consensus integration tests..."
      echo "Suites: raft, smartbft"
      echo "⏱️  Estimated time: ~5 minutes"
      echo ""
      make integration-test INTEGRATION_TEST_SUITE="raft smartbft"
      echo ""
      echo "✅ Consensus tests complete"

  test-ledger:
    name: "test-ledger"
    description: "Run ledger integration tests: ledger + pvtdata + pvtdatapurge (~8 min)"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      
      # Ensure Docker images available
      if ! docker images | grep -q "hyperledger/fabric-peer"; then
        echo "Pulling Docker images..."
        make docker-thirdparty
      fi
      
      # Ensure CouchDB available
      if ! docker images | grep -q "couchdb"; then
        echo "Pulling CouchDB image..."
        make docker-thirdparty-couchdb
      fi
      
      echo "Running ledger integration tests..."
      echo "Suites: ledger, pvtdata, pvtdatapurge"
      echo "⏱️  Estimated time: ~8 minutes"
      echo ""
      make integration-test INTEGRATION_TEST_SUITE="ledger pvtdata pvtdatapurge"
      echo ""
      echo "✅ Ledger tests complete"

  test-lifecycle:
    name: "test-lifecycle"
    description: "Run chaincode lifecycle tests: lifecycle + devmode + pluggable (~6 min)"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      
      if ! docker images | grep -q "hyperledger/fabric-peer"; then
        echo "Pulling Docker images..."
        make docker-thirdparty
      fi
      
      echo "Running chaincode lifecycle integration tests..."
      echo "Suites: lifecycle, devmode, pluggable"
      echo "⏱️  Estimated time: ~6 minutes"
      echo ""
      make integration-test INTEGRATION_TEST_SUITE="lifecycle devmode pluggable"
      echo ""
      echo "✅ Lifecycle tests complete"

  test-gateway:
    name: "test-gateway"
    description: "Run gateway integration tests: gateway + discovery + gossip (~5 min)"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      
      if ! docker images | grep -q "hyperledger/fabric-peer"; then
        echo "Pulling Docker images..."
        make docker-thirdparty
      fi
      
      echo "Running gateway integration tests..."
      echo "Suites: gateway, discovery, gossip"
      echo "⏱️  Estimated time: ~5 minutes"
      echo ""
      make integration-test INTEGRATION_TEST_SUITE="gateway discovery gossip"
      echo ""
      echo "✅ Gateway tests complete"

  test-e2e:
    name: "test-e2e"
    description: "Run end-to-end integration tests: e2e + nwo + sbe + msp (~10 min)"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      
      if ! docker images | grep -q "hyperledger/fabric-peer"; then
        echo "Pulling Docker images..."
        make docker-thirdparty
      fi
      
      echo "Running end-to-end integration tests..."
      echo "Suites: e2e, nwo, sbe, msp"
      echo "⏱️  Estimated time: ~10 minutes"
      echo ""
      make integration-test INTEGRATION_TEST_SUITE="e2e nwo sbe msp"
      echo ""
      echo "✅ E2E tests complete"

  test-integration-all:
    name: "test-integration-all"
    description: "Run ALL integration tests (~30 min) - use specific suites for faster feedback"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      
      if ! docker images | grep -q "hyperledger/fabric-peer"; then
        echo "Pulling Docker images..."
        make docker-thirdparty
      fi
      
      if ! docker images | grep -q "couchdb"; then
        echo "Pulling CouchDB image..."
        make docker-thirdparty-couchdb
      fi
      
      echo "Running ALL integration tests..."
      echo "⏱️  This will take 15-30 minutes"
      echo ""
      echo "💡 Consider using specific test suites for faster feedback:"
      echo "   - test-consensus (~5 min)  - Raft and SmartBFT consensus"
      echo "   - test-ledger (~8 min)     - Ledger and private data"
      echo "   - test-lifecycle (~6 min)  - Chaincode lifecycle"
      echo "   - test-gateway (~5 min)    - Gateway and discovery"
      echo "   - test-e2e (~10 min)       - End-to-end scenarios"
      echo ""
      
      make integration-test
      EXIT_CODE=$?
      
      echo "Cleaning up integration test artifacts..."
      find integration/ -name "*.test" -type f -delete 2>/dev/null || true
      find core/chaincode/platforms/golang/testdata/pkg/ -type f -delete 2>/dev/null || true
      
      if [ $EXIT_CODE -eq 0 ]; then
        echo "✅ All integration tests passed"
      else
        echo "❌ Integration tests failed (exit code: $EXIT_CODE)"
        exit $EXIT_CODE
      fi

  # ============================================================================
  # CODE QUALITY (1) - Pre-commit checks
  # ============================================================================
  
  check-code:
    name: "check-code"
    description: "Run basic code checks and linting (~3-5 min)"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Running code checks..."
      echo "This includes: license headers, spelling, trailing spaces, linting"
      make basic-checks
      echo ""
      echo "✅ Code checks passed"

  # ============================================================================
  # DOCKER (2) - Container image management
  # ============================================================================
  
  build-docker:
    name: "build-docker"
    description: "Build Fabric Docker images (~10-15 min)"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Building Fabric Docker images..."
      echo "⏱️  This will take 10-15 minutes"
      make docker
      echo ""
      echo "✅ Docker images built"
      echo ""
      docker images | grep hyperledger/fabric

  setup-couchdb:
    name: "setup-couchdb"
    description: "Pull CouchDB Docker image for ledger integration tests"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Pulling CouchDB Docker image..."
      make docker-thirdparty-couchdb
      echo ""
      echo "✅ CouchDB image ready"
      echo "💡 Use 'start-network-couchdb' to start network with CouchDB"

  # ============================================================================
  # UTILITIES (2) - Cleanup operations
  # ============================================================================
  
  clean-integration-tests:
    name: "clean-integration-tests"
    description: "Clean integration test artifacts (*.test binaries)"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Cleaning integration test artifacts..."
      TEST_COUNT=$(find integration/ -name "*.test" -type f 2>/dev/null | wc -l)
      if [ "$TEST_COUNT" -gt 0 ]; then
        echo "Found $TEST_COUNT test binaries to clean..."
        find integration/ -name "*.test" -type f -delete 2>/dev/null || true
        find core/chaincode/platforms/golang/testdata/pkg/ -type f -delete 2>/dev/null || true
        echo "✅ Cleaned $TEST_COUNT test binaries (~$(($TEST_COUNT * 25))MB freed)"
      else
        echo "No integration test artifacts found"
      fi

  clean-all:
    name: "clean-all"
    description: "Clean all build artifacts, test binaries, and Docker resources"
    triggeredBy:
      - manual
    command: |
      cd /workspaces/fabric
      echo "Cleaning build artifacts..."
      make clean-all
      
      echo "Cleaning integration test artifacts..."
      find integration/ -name "*.test" -type f -delete 2>/dev/null || true
      find core/chaincode/platforms/golang/testdata/pkg/ -type f -delete 2>/dev/null || true
      
      echo "Stopping any running test networks..."
      if [ -d "/workspaces/fabric-samples/test-network" ]; then
        cd /workspaces/fabric-samples/test-network
        ./network.sh down 2>/dev/null || true
      fi
      
      echo "Cleaning Docker resources..."
      docker system prune -f
      
      echo ""
      echo "✅ Cleanup complete"
      echo "Run 'gitpod automations task start build-fabric' to rebuild binaries"
